name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read the Swift version the package requires
        id: package
        run: |
          echo "swift=$(sed -n 's|^// swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' Package.swift)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Check the toolchain satisfies the package
        run: |
          required='${{ steps.package.outputs.swift }}'
          installed=$(swift --version | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p')
          case "$installed" in
            "$required"*) echo "Swift $installed satisfies the required $required" ;;
            *) echo "::error::Package.swift requires Swift $required but this runner provides $installed"; exit 1 ;;
          esac

      - name: Build documentation
        run: |
          swift package --allow-writing-to-directory ./docs \
            generate-documentation \
            --target CUID \
            --transform-for-static-hosting \
            --hosting-base-path cuid \
            --output-path ./docs

      - name: Redirect the site root to the documentation
        run: |
          cat > ./docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./documentation/cuid/">
              <title>CUID</title>
            </head>
            <body><a href="./documentation/cuid/">CUID documentation</a></body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

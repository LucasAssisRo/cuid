name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-test:
    runs-on: xcode-27

    steps:
    - uses: actions/checkout@v4

    - name: Read the Swift version the package requires
      id: package
      run: |
        echo "swift=$(sed -n 's|^// swift-tools-version: *\([0-9][0-9.]*\).*|\1|p' Package.swift)" >> "$GITHUB_OUTPUT"

    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest

    - name: Check the toolchain satisfies the package
      run: |
        required='${{ steps.package.outputs.swift }}'
        installed=$(swift --version | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p')
        case "$installed" in
          "$required"*) echo "Swift $installed satisfies the required $required" ;;
          *) echo "::error::Package.swift requires Swift $required but this runner provides $installed"; exit 1 ;;
        esac

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v
